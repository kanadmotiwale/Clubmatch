<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members · ClubMatch</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/members.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="nav-logo">ClubMatch</a>
      <button class="hamburger" id="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/clubs.html">Clubs</a>
        <a href="/membership-logs.html">Membership Logs</a>
        <a href="/members.html" class="active">Members</a>
        <button class="btn-admin" id="admin-btn">Admin</button>
      </div>
    </nav>

    <main class="container">
      <div class="page-header">
        <h1>Members</h1>
        <button id="create-profile-btn" class="btn-primary">
          + Create My Profile
        </button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="members">Members</button>
        <button class="tab-btn" data-tab="students">Students</button>
      </div>

      <div class="filters">
        <input
          type="text"
          id="search-members"
          placeholder="Search by name or interest..."
        />
      </div>

      <div id="profile-form-container" class="form-container hidden">
        <h2 id="profile-form-title">Create My Profile</h2>
        <form id="profile-form">
          <input type="hidden" id="profile-id" />
          <div class="form-group">
            <label for="profile-name">Full Name</label>
            <input type="text" id="profile-name" required />
          </div>
          <div class="form-group">
            <label for="profile-email">Email</label>
            <input type="email" id="profile-email" required />
          </div>
          <div class="form-group">
            <label for="profile-major">Major</label>
            <input type="text" id="profile-major" required />
          </div>
          <div class="form-group">
            <label for="profile-year">Year</label>
            <select id="profile-year" required>
              <option value="">Select year</option>
              <option value="Freshman">Freshman</option>
              <option value="Sophomore">Sophomore</option>
              <option value="Junior">Junior</option>
              <option value="Senior">Senior</option>
              <option value="Graduate">Graduate</option>
            </select>
          </div>
          <div class="form-group">
            <label for="profile-bio">Bio</label>
            <textarea
              id="profile-bio"
              rows="3"
              placeholder="Tell others a bit about yourself..."
            ></textarea>
          </div>
          <div class="form-group">
            <label for="profile-interests">Interests (comma separated)</label>
            <input
              type="text"
              id="profile-interests"
              placeholder="e.g. Academic, Sports, Arts"
            />
          </div>
          <div class="form-group">
            <label for="profile-clubs">Joined Clubs (comma separated)</label>
            <input
              type="text"
              id="profile-clubs"
              placeholder="e.g. Robotics Club, Debate Team"
            />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-profile-btn" class="btn-secondary">
              Cancel
            </button>
            <button type="submit" class="btn-primary">Save Profile</button>
          </div>
        </form>
      </div>

      <div id="members-list" class="members-grid"></div>
    </main>

    <div id="member-detail-overlay" class="detail-overlay hidden">
      <div class="detail-box">
        <button class="detail-close" id="member-detail-close">✕</button>
        <div id="member-detail-content"></div>
      </div>
    </div>

    <div id="admin-modal" class="admin-modal-overlay hidden">
      <div class="admin-modal-box">
        <h2>Admin Access</h2>
        <p>Enter the admin password to manage members.</p>
        <input
          type="password"
          id="admin-password-input"
          placeholder="Password"
        />
        <div id="admin-error" class="admin-error hidden">
          Incorrect password. Try again.
        </div>
        <div class="admin-modal-actions">
          <button id="admin-modal-cancel" class="btn-secondary">Cancel</button>
          <button id="admin-modal-submit" class="btn-primary">Login</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>CS5610 Web Development · Northeastern University</p>
    </footer>

    <script>
      document.getElementById("hamburger-btn").addEventListener("click", () => {
        document.querySelector(".nav-links").classList.toggle("open");
      });
    </script>
    <script type="module" src="/js/members.js"></script>
  </body>
</html>
