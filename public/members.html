<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members · ClubMatch</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/members.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="nav-logo">ClubMatch</a>
      <div class="nav-links">
        <a href="/clubs.html">Clubs</a>
        <a href="/membership-logs.html">Membership Logs</a>
        <a href="/members.html" class="active">Members</a>
      </div>
    </nav>

    <main class="container">
      <div class="page-header">
        <h1>Members</h1>
        <button id="register-btn" class="btn-primary">+ Register</button>
      </div>

      <div class="filters">
        <input
          type="text"
          id="search-members"
          placeholder="Search by name or interest..."
        />
      </div>

      <div id="member-form-container" class="form-container hidden">
        <h2 id="form-title">Register Profile</h2>
        <form id="member-form">
          <input type="hidden" id="member-id" />
          <div class="form-group">
            <label for="member-name">Full Name</label>
            <input type="text" id="member-name" required />
          </div>
          <div class="form-group">
            <label for="member-email">Email</label>
            <input type="email" id="member-email" required />
          </div>
          <div class="form-group">
            <label for="member-major">Major</label>
            <input type="text" id="member-major" required />
          </div>
          <div class="form-group">
            <label for="member-year">Year</label>
            <select id="member-year" required>
              <option value="">Select year</option>
              <option value="Freshman">Freshman</option>
              <option value="Sophomore">Sophomore</option>
              <option value="Junior">Junior</option>
              <option value="Senior">Senior</option>
              <option value="Graduate">Graduate</option>
            </select>
          </div>
          <div class="form-group">
            <label for="member-bio">Bio</label>
            <textarea id="member-bio" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="member-interests">Interests (comma separated)</label>
            <input type="text" id="member-interests" placeholder="e.g. Academic, Sports, Arts" />
          </div>
          <div class="form-group">
            <label for="member-clubs">Joined Clubs (comma separated)</label>
            <input type="text" id="member-clubs" placeholder="e.g. Robotics Club, Debate Team" />
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-member-btn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Save Profile</button>
          </div>
        </form>
      </div>

      <div id="members-list" class="members-grid"></div>
    </main>

    <footer class="footer">
      <p>CS5610 Web Development · Northeastern University · Kanad Motiwale & Aarya Patil</p>
    </footer>

    <script type="module" src="/js/members.js"></script>
  </body>
</html>
